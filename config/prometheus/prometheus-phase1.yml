global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PolyClaw agent metrics (runs on host, accessible via host.docker.internal)
  - job_name: 'polyclaw-agent'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
