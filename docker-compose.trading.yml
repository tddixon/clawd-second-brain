version: '3.8'

networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  timescale_data:
  ipfs_data:
  loki_data:

services:
  # ==========================================
  # DATABASE LAYER
  # ==========================================
  
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_env}
      POSTGRES_DB: ${DB_NAME:-trading_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: trading-timescale
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TSDB_USER:-trader}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-changeme_in_env}
      POSTGRES_DB: ${TSDB_NAME:-market_data}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init-scripts/timescale:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - trading-network
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c work_mem=50MB

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # MONITORING STACK
  # ==========================================
  
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: trading-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - trading-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.2.3
    container_name: trading-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${EMAIL_SMTP_HOST:-}
      - GF_SMTP_USER=${EMAIL_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${EMAIL_SMTP_PASS:-}
      - GF_SMTP_FROM_ADDRESS=${EMAIL_SMTP_USER:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - trading-network
    depends_on:
      - prometheus
      - postgres

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: trading-alertmanager
    restart: unless-stopped
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - trading-network

  loki:
    image: grafana/loki:2.9.0
    container_name: trading-loki
    restart: unless-stopped
    volumes:
      - ./config/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - trading-network
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    container_name: trading-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - ./logs:/var/log/trading:ro
    networks:
      - trading-network
    command: -config.file=/etc/promtail/config.yml

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: trading-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - trading-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: trading-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - trading-network

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.11
    container_name: trading-uptime
    restart: unless-stopped
    volumes:
      - ./data/uptime-kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - trading-network

  # ==========================================
  # BLOCKCHAIN INFRASTRUCTURE (OPTIONAL)
  # ==========================================
  
  # Uncomment to run local Ethereum node (requires significant resources)
  # geth:
  #   image: ethereum/client-go:v1.13.5
  #   container_name: trading-geth
   #   restart: unless-stopped
  #   volumes:
  #     - ./data/geth:/root/.ethereum
  #   ports:
  #     - "30303:30303"
  #     - "30303:30303/udp"
  #     - "127.0.0.1:8545:8545"
  #     - "127.0.0.1:8546:8546"
  #   networks:
  #     - trading-network
  #   command: >
  #     --mainnet
  #     --syncmode snap
  #     --http
  #     --http.addr 0.0.0.0
  #     --http.port 8545
  #     --http.api eth,net,web3,engine
  #     --http.vhosts '*'
  #     --http.corsdomain '*'
  #     --ws
  #     --ws.addr 0.0.0.0
  #     --ws.port 8546
  #     --ws.api eth,net,web3
  #     --authrpc.addr 0.0.0.0
  #     --authrpc.port 8551
  #     --metrics
  #     --metrics.addr 0.0.0.0
  #     --metrics.port 6060

  # ==========================================
  # DATABASE EXPORTERS (for Prometheus)
  # ==========================================
  
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: trading-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-trader}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-trading_db}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - trading-network
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: trading-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - trading-network
    depends_on:
      - redis

  # ==========================================
  # TRADING SERVICES (Python/Node implementations)
  # ==========================================
  
  arbitrage-engine:
    build:
      context: ./services/arbitrage
      dockerfile: Dockerfile
    container_name: trading-arbitrage
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-trading_db}
      - DB_USER=${DB_USER:-trader}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POLYMARKET_API_KEY=${POLYMARKET_API_KEY}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - MAX_POSITION_SIZE_USD=${MAX_POSITION_SIZE_USD:-1000}
      - MAX_DAILY_LOSS_USD=${MAX_DAILY_LOSS_USD:-500}
      - MIN_PROFIT_PERCENT=${MIN_PROFIT_PERCENT:-0.5}
    volumes:
      - ./config/arbitrage:/app/config:ro
      - ./logs/arbitrage:/app/logs
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - trading-network
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  funding-farmer:
    build:
      context: ./services/funding
      dockerfile: Dockerfile
    container_name: trading-funding
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=${TSDB_NAME:-market_data}
      - DB_USER=${TSDB_USER:-trader}
      - DB_PASSWORD=${TSDB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MIN_YIELD_THRESHOLD=${MIN_YIELD_THRESHOLD:-10}
      - TRADING_MODE=${TRADING_MODE:-paper}
    volumes:
      - ./config/funding:/app/config:ro
      - ./logs/funding:/app/logs
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - trading-network
    depends_on:
      - timescaledb
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  whale-tracker:
    build:
      context: ./services/whale-tracker
      dockerfile: Dockerfile
    container_name: trading-whale
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-trading_db}
      - DB_USER=${DB_USER:-trader}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ETH_RPC_URLS=${ETH_RPC_URLS:-https://eth.llamarpc.com,https://rpc.ankr.com/eth,https://ethereum.publicnode.com}
      - POLYGON_RPC_URLS=${POLYGON_RPC_URLS:-https://polygon.llamarpc.com,https://rpc.ankr.com/polygon}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./config/whale-tracker:/app/config:ro
      - ./data/labels:/app/data/labels:ro
      - ./logs/whale-tracker:/app/logs
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      - trading-network
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  news-scraper:
    build:
      context: ./services/news
      dockerfile: Dockerfile
    container_name: trading-news
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-trading_db}
      - DB_USER=${DB_USER:-trader}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SCRAPE_INTERVAL_MINUTES=${SCRAPE_INTERVAL_MINUTES:-5}
    volumes:
      - ./config/news:/app/config:ro
      - ./logs/news:/app/logs
    ports:
      - "127.0.0.1:8084:8080"
    networks:
      - trading-network
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ==========================================
  # REVERSE PROXY (Optional but recommended)
  # ==========================================
  
  nginx:
    image: nginx:alpine
    container_name: trading-nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - trading-network
    depends_on:
      - grafana
      - uptime-kuma
